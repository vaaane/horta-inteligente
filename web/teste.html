<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste Acende/Apaga</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <!-- Estilo do site (cartões, cores); os ajustes desta página vêm logo abaixo -->
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --verde: #2e7d32;
      --verde-brilho: #4caf50;
      --cinza: #b0bec5;
      --fundo: #f4f8f3;
      --texto: #1b2a1c;
      --texto-suave: #5b6b5c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      text-align: center;
    }

    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); }

    /* O "LED" da tela */
    .led {
      width: min(60vw, 280px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--cinza);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }
    .led.aceso {
      background: var(--verde-brilho);
      box-shadow: 0 0 40px 10px rgba(76, 175, 80, 0.6),
                  0 0 100px 30px rgba(76, 175, 80, 0.3);
    }

    .estado {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--texto-suave);
      transition: color 0.5s ease;
    }
    .estado.aceso { color: var(--verde); }

    .hora { margin: 0; color: var(--texto-suave); }

    a { color: var(--texto-suave); font-size: 0.85rem; }

    /* Cartão "Clima agora" */
    .clima {
      width: 100%;
      max-width: 480px;
      margin: 0;
      text-align: left;
    }
    .clima-valores {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 12px 0;
    }
    .clima-valores dt { font-size: 0.85rem; color: var(--texto-suave); }
    .clima-valores dd {
      margin: 2px 0 0;
      font-size: clamp(1.5rem, 6vw, 2rem);
      font-weight: 700;
      color: var(--verde);
      font-variant-numeric: tabular-nums;
    }
    .clima-explica, .clima-rodape { margin: 0; color: var(--texto-suave); font-size: 0.9rem; }
    .clima-rodape { margin-top: 8px; font-size: 0.85rem; }
    .clima-aviso { margin: 8px 0 0; color: #8a4b00; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>💡 Teste: ESP32 → Firebase → site</h1>

  <div id="led" class="led"></div>
  <p id="estado" class="estado">APAGADO</p>
  <p id="hora" class="hora">Conectando ao Firebase...</p>

  <section class="cartao clima">
    <h2>Clima agora</h2>
    <p id="clima-espera" class="clima-explica">Aguardando dados do ESP32…</p>

    <div id="clima-dados" hidden>
      <dl class="clima-valores">
        <div><dt>Temperatura</dt><dd id="clima-temp">--</dd></div>
        <div><dt>Umidade do ar</dt><dd id="clima-umidade">--</dd></div>
        <div><dt>Chuva nas próximas 6 h</dt><dd id="clima-chuva">--</dd></div>
        <div><dt>ET₀ hoje</dt><dd id="clima-et0">--</dd></div>
      </dl>
      <p id="clima-explica" class="clima-explica"></p>
      <p id="clima-atualizado" class="clima-rodape"></p>
      <p id="clima-aviso" class="clima-aviso" hidden></p>
    </div>
  </section>

  <a href="index.html">← Voltar para a horta</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const db = getDatabase(initializeApp(firebaseConfig));

    const elLed = document.getElementById("led");
    const elEstado = document.getElementById("estado");
    const elHora = document.getElementById("hora");

    // Toda vez que teste/led mudar no Firebase, esta função roda
    onValue(ref(db, "teste/led"), (snap) => {
      const aceso = snap.val() === true;  // vazio ou false = apagado

      elLed.classList.toggle("aceso", aceso);
      elEstado.classList.toggle("aceso", aceso);
      elEstado.textContent = aceso ? "ACESO" : "APAGADO";

      const hora = new Date().toLocaleTimeString("pt-BR");
      elHora.textContent = `Última mudança: ${hora}`;
    });

    // ---------- Cartão "Clima agora" ----------
    const LIMITE_CLIMA_ANTIGO_MS = 90 * 60 * 1000;  // 90 minutos

    const $ = (id) => document.getElementById(id);
    const numero = (valor, casas) =>
      Number(valor).toLocaleString("pt-BR", { maximumFractionDigits: casas });

    let diferencaRelogio = 0;  // relógio do servidor - relógio do celular
    let atualizadoEm = null;   // hora (do servidor) em que o ESP32 gravou o clima

    onValue(ref(db, ".info/serverTimeOffset"), (snap) => {
      diferencaRelogio = snap.val() || 0;
    });

    // Toda vez que o ESP32 gravar um clima novo, esta função roda
    onValue(ref(db, "clima"), (snap) => {
      const c = snap.val();
      const temDados = c && c.temperatura !== undefined;
      $("clima-espera").hidden = temDados;
      $("clima-dados").hidden = !temDados;
      if (!temDados) return;

      $("clima-temp").textContent = `${numero(c.temperatura, 1)} °C`;
      $("clima-umidade").textContent = `${c.umidadeAr} %`;
      $("clima-chuva").textContent = `${c.chanceChuva6h} %`;
      $("clima-et0").textContent = `${numero(c.et0, 1)} mm`;
      $("clima-explica").textContent =
        `A planta de referência perde cerca de ${numero(c.et0, 1)} litros de água por m² hoje.`;

      // "Atualizado às HH:MM": usa a hora do Firebase; se não tiver, a da previsão
      atualizadoEm = typeof c.atualizadoEm === "number" ? c.atualizadoEm : null;
      const hhmm = atualizadoEm !== null
        ? new Date(atualizadoEm).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
        : String(c.horaPrevisao || "").slice(11, 16);
      $("clima-atualizado").textContent = `Atualizado às ${hhmm}`;

      verificarClimaAntigo();
    });

    // Aviso discreto se o ESP32 parar de mandar o clima
    function verificarClimaAntigo() {
      if (atualizadoEm === null) {
        $("clima-aviso").hidden = true;
        return;
      }
      const idade = Date.now() + diferencaRelogio - atualizadoEm;
      const antigo = idade > LIMITE_CLIMA_ANTIGO_MS;
      $("clima-aviso").hidden = !antigo;
      if (antigo) {
        $("clima-aviso").textContent = `ESP32 sem atualizar o clima há ${Math.floor(idade / 60000)} min`;
      }
    }
    setInterval(verificarClimaAntigo, 30000);
  </script>
</body>
</html>
